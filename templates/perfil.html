{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <!-- Encabezado y Navegación de Retorno -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-primary mb-0">Mi Perfil de Usuario ⚙️</h3>
            <a href="{% if usuario.nombre_rol == 'Tutor' %}{{ url_for('dashboard_tutor') }}{% else %}{{ url_for('dashboard_aprendiz') }}{% endif %}" 
               class="btn btn-outline-secondary btn-sm fw-semibold">
                ⬅️ Volver al Panel Principal
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <form action="{{ url_for('guardar_perfil') }}" method="POST">
                    
                    <h5 class="fw-bold text-secondary mb-3 border-bottom pb-2">Información Académica y Personal</h5>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Nombre</label>
                            <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Apellido</label>
                            <input type="text" name="apellido" class="form-control" value="{{ usuario.apellido }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Correo Institucional (No editable)</label>
                            <input type="email" class="form-control bg-light" value="{{ usuario.correo }}" readonly disabled>
                            <small class="text-muted fs-7">El correo institucional está vinculado a tu cuenta universitaria.</small>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted">Rol en la Plataforma</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.nombre_rol }}" readonly disabled>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted">Semestre Actual</label>
                            <select name="semestre" class="form-select" required>
                                {% for i in range(1, 11) %}
                                    <option value="{{ i }}" {% if usuario.semestre == i %}selected{% endif %}>
                                        {{ i }}° Semestre
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Sección Opcional: Cambio de Contraseña -->
                    <div class="border rounded-3 p-3 bg-light mb-4">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="checkPassword" data-bs-toggle="collapse" data-bs-target="#seccionPassword">
                            <label class="form-check-label fw-bold text-dark" for="checkPassword">
                                ¿Deseas cambiar tu contraseña de acceso? 🔒
                            </label>
                        </div>

                        <div class="collapse mt-3" id="seccionPassword">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label small text-muted">Contraseña Actual</label>
                                    <input type="password" name="pass_actual" class="form-control form-control-sm" placeholder="Ingresa tu clave actual">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small text-muted">Nueva Contraseña</label>
                                    <input type="password" name="pass_nueva" class="form-control form-control-sm" placeholder="Mínimo 6 caracteres">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small text-muted">Confirmar Nueva Contraseña</label>
                                    <input type="password" name="pass_confirmar" class="form-control form-control-sm" placeholder="Repite la clave nueva">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% if usuario.nombre_rol == 'Tutor' %}{{ url_for('dashboard_tutor') }}{% else %}{{ url_for('dashboard_aprendiz') }}{% endif %}" 
                           class="btn btn-secondary btn-sm">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-sm fw-bold px-4">💾 Guardar Cambios</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
